<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::contenido})}">

<head>
    <title>Catálogo de Juegos - GameVault</title>
</head>

<body>

<th:block th:fragment="contenido">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 class="text-gradient">Catálogo de Juegos</h2>

        <a th:href="@{/juegos/nuevo}" class="btn btn-primary">
            + Nuevo Juego
        </a>
    </div>

    <div class="grid">

        <div class="panel"
             th:each="juego : ${juegos}"
             style="padding: 0; overflow: hidden;">

            <img th:src="${juego.portadaUrl}"
                 alt="Portada"
                 style="width: 100%; height: 300px; object-fit: cover; display: block;">

            <div style="padding: 20px;">

                <h3 th:text="${juego.titulo}"
                    style="margin-top: 0; margin-bottom: 10px;">
                    Título del Juego
                </h3>

                <p th:text="${juego.descripcion}"
                   style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin: 0;">
                    Descripción breve del juego.
                </p>

            </div>

        </div>

    </div>

    <div th:if="${#lists.isEmpty(juegos)}"
         style="text-align: center; padding: 50px; color: var(--text-muted);">

        <p>No hay juegos en el catálogo. ¡Sé el primero en subir uno!</p>

    </div>

</th:block>

</body>
</html>
